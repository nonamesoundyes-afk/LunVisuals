name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Якщо ваш проєкт написаний під Java 8, 11 або 21 — змініть цю цифру
          distribution: 'temurin'
          cache: 'gradle'

      # Використовуємо встановлений у системі gradle замість локального скрипта ./gradlew
      - name: Build with Gradle
        run: gradle build -x test

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ready-jar-file
          path: build/libs/*.jar
