name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Якщо у вас інша версія Java (напр. 8, 11, 21), змініть цю цифру
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test  # -x test пропускає тести для прискорення збірки

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ready-jar-file
          path: build/libs/*.jar
