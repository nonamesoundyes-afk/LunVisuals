name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21' 
          distribution: 'temurin'
          cache: 'gradle'

      # Додаємо прапорець, який дозволяє плагінам Fabric інжектувати репозиторії
      - name: Build with Gradle
        run: gradle build -x test -Dorg.gradle.dependency.verification=off
        env:
          GRADLE_OPTS: "-Dorg.gradle.dependency.verification=off"

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ready-jar-file
          path: build/libs/*.jar
